name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整 git history 用于提取 commit 消息

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      # 提取最近的 commit 消息作为发布说明
      # 优先使用 RELEASE_NOTES.md（手写），否则自动从 git commit 提取
      - name: Generate release notes
        id: release_notes
        shell: bash
        run: |
          CURRENT_TAG=${GITHUB_REF#refs/tags/}

          # 优先检查是否存在手写发布说明
          if [ -f "RELEASE_NOTES.md" ]; then
            echo "使用手写 RELEASE_NOTES.md"
            NOTES=$(cat RELEASE_NOTES.md)
          else
            echo "从 git commit 自动生成发布说明"
            PREV_TAG=$(git tag --sort=-creatordate | head -2 | tail -1)

            if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$CURRENT_TAG" ]; then
              NOTES=$(git log --pretty=format:"- %s" -20)
            else
              NOTES=$(git log --pretty=format:"- %s" ${PREV_TAG}..${CURRENT_TAG})
            fi
          fi

          # 使用 heredoc 安全写入多行 output
          {
            echo "notes<<NOTES_EOF"
            echo "$NOTES"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "=== 发布说明 ==="
          echo "$NOTES"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Ω Notes ${{ github.ref_name }}'
          releaseBody: |
            ## 更新内容

            ${{ steps.release_notes.outputs.notes }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
