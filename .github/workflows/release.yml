name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整 git history 用于提取 commit 消息

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      # 提取最近的 commit 消息作为发布说明
      - name: Generate release notes from commits
        id: release_notes
        shell: bash
        run: |
          # 找到上一个 tag（如果有的话）
          PREV_TAG=$(git tag --sort=-creatordate | head -2 | tail -1)
          CURRENT_TAG=${GITHUB_REF#refs/tags/}

          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$CURRENT_TAG" ]; then
            # 首次发布或只有一个 tag，取最近 20 条 commit
            COMMITS=$(git log --pretty=format:"- %s" -20)
          else
            # 取两个 tag 之间的 commit
            COMMITS=$(git log --pretty=format:"- %s" ${PREV_TAG}..${CURRENT_TAG})
          fi

          # 写入到文件（避免多行字符串在 GitHub Actions 中的换行问题）
          echo "$COMMITS" > release_notes.txt
          echo "Generated release notes:"
          cat release_notes.txt

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Ω Notes ${{ github.ref_name }}'
          releaseBody: |
            ## 更新内容

            ${{ steps.release_notes.outputs.notes || '' }}

            ---
            查看完整更新日志: [CHANGELOG.md](https://github.com/NightMin2002/omega-notes/blob/main/CHANGELOG.md)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
